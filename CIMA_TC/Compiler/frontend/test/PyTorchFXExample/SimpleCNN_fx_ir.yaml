layers:
  graph_input:
    type: input
    outputs:
    - channel: 3
      channel_last: true
      width: 32
      height: 32
  Conv2D:
    type: op
    inputs:
    - ref: graph_input:0
      channel: 3
      channel_last: true
      width: 32
      height: 32
    outputs:
    - channel: 16
      channel_last: true
      width: 32
      height: 32
    weights:
      weight:
        shape:
        - 16
        - 3
        - 3
        - 3
      bias:
        shape:
        - 16
    op:
      op_id: conv2d
      in_channel: 3
      out_channel: 16
      bias: true
      group: 1
      kernel: 3
      stride: 1
      padding: 1
      dilation: 1
      groups: 1
  Relu:
    type: op
    inputs:
    - ref: Conv2D
      channel: 16
      channel_last: true
      width: 32
      height: 32
    outputs:
    - channel: 16
      channel_last: true
      width: 32
      height: 32
    op:
      op_id: relu
  Conv2D_1:
    type: op
    inputs:
    - ref: Relu
      channel: 16
      channel_last: true
      width: 32
      height: 32
    outputs:
    - channel: 32
      channel_last: true
      width: 32
      height: 32
    weights:
      weight:
        shape:
        - 32
        - 16
        - 3
        - 3
      bias:
        shape:
        - 32
    op:
      op_id: conv2d
      in_channel: 16
      out_channel: 32
      bias: true
      group: 1
      kernel: 3
      stride: 1
      padding: 1
      dilation: 1
      groups: 1
  Relu_1:
    type: op
    inputs:
    - ref: Conv2D_1
      channel: 32
      channel_last: true
      width: 32
      height: 32
    outputs:
    - channel: 32
      channel_last: true
      width: 32
      height: 32
    op:
      op_id: relu
  Adaptiveavgpool2D:
    type: op
    inputs:
    - ref: Relu_1
      channel: 32
      channel_last: true
      width: 32
      height: 32
    outputs:
    - channel: 32
      channel_last: true
      width: 1
      height: 1
    op:
      op_id: global_avg_pool2d
  Flatten:
    type: op
    inputs:
    - ref: Adaptiveavgpool2D
      channel: 32
      channel_last: true
      width: 1
      height: 1
    outputs:
    - channel: 32
      channel_last: true
      width: 1
      height: 1
    op:
      op_id: flatten
      with_batch: true
      start_dim: 1
  Linear:
    type: op
    inputs:
    - ref: Flatten
      channel: 32
      channel_last: true
      width: 1
      height: 1
    outputs:
    - channel: 10
      channel_last: true
      width: 1
      height: 1
    weights:
      weight:
        shape:
        - 10
        - 32
      bias:
        shape:
        - 10
    op:
      op_id: linear
      in_channel: 32
      out_channel: 10
      bias: true
  graph_output:
    type: output
    inputs:
    - ref: Linear
      channel: 10
      channel_last: true
      width: 1
      height: 1
